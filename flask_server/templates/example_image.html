<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/2.4.2/openseadragon.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f7f9fa;
            color: #222;
        }
        .image-header {
            background: #e3eaf2;
            border-radius: 10px;
            padding: 18px 24px 12px 24px;
            margin: 24px auto 12px auto;
            max-width: 900px;
            box-shadow: 0 2px 8px #0001;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
        }
        .image-header .legend {
            font-size: 1.08em;
            margin-bottom: 4px;
        }
        .image-header .instructions {
            font-size: 0.98em;
            color: #555;
            margin-left: 16px;
        }
        .image-header .image-label {
            font-weight: 600;
            color: #2a5d9f;
            font-size: 1.1em;
            margin-left: 12px;
        }
        #openseadragon-viewer {
            width: 100%;
            height: 500px;
            background: #eaf1f7;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0001;
            margin: 0 auto 18px auto;
            max-width: 900px;
        }
        .save-link {
            display: inline-block;
            margin: 18px 0 0 0;
            font-size: 1.05em;
            color: #2a5d9f;
            background: #e3eaf2;
            border-radius: 6px;
            padding: 7px 18px;
            text-decoration: none;
            transition: background 0.2s;
        }
        .save-link:hover {
            background: #d0e0f0;
            color: #17406a;
        }
        .save-path {
            font-size: 0.98em;
            color: #2a5d9f;
            margin: 8px 0 0 0;
            background: #f3f7fa;
            border-radius: 6px;
            padding: 7px 12px;
            max-width: 900px;
        }
        .detection-details {
            background: #f8fafc;
            border-radius: 8px;
            box-shadow: 0 1px 4px #0001;
            padding: 14px 18px;
            margin: 18px auto 0 auto;
            max-width: 900px;
            font-size: 1.01em;
        }
        .detection-details-title {
            font-weight: 600;
            color: #2a5d9f;
            margin-bottom: 6px;
        }
    </style>
</head>

<div class="image-header">
    <div>
        <span class="legend">Legend:</span>
        <span style="color:blue;">Prediction</span> <span style="color:#888;">----</span> <span style="color: green;">GT</span> <span style="color:#888;">----</span>
        {% if images_num>1 %}
            <span class="instructions">(Alt + Left click: next image, Ctrl + Left click: previous image)</span>
        {% endif %}
    </div>
    <span class="image-label">Image: <label id="image-name-label"></label></span>
</div>
<div id="openseadragon-viewer"></div>
<script type="text/javascript">
    function updateImageName() {
        var currentImage = Object.keys(imgs)[cur_img];
        // If the element is not yet in the DOM, wait until it is.
        let imageNameLabel = document.getElementById('image-name-label');
        if (!imageNameLabel) {
            window.addEventListener('DOMContentLoaded', updateImageName, { once: true });
            return;
        }
        if (imageNameLabel) {
            // Update the label text with the current image name
            imageNameLabel.textContent = currentImage;
        } else {
            // If the label is not found, log an error
            console.error("Image name label not found in the document.");
        }
        
    }
    
    imgs = {};
    {% for image in images_list %} 
        imgs["{{ image }}"] = 'data:image/png;base64,{{ images_list[image] }}'
    {%endfor%} 
    cur_img = 0
    
    // Bounding box coordinates (x, y, width, height)
    var boundingBox = {{ images_coords|default('null')|safe }};
    boundingBox = boundingBox ? {
        x: boundingBox[0],
        y: boundingBox[1],
        width: boundingBox[2],
        height: boundingBox[3]
    } : null;
    // Store relative viewport state (as percentage of bounding box)
    var relativeViewportState = {
        zoom: 1.0,
        panX: 0.5,  // relative to bounding box (0-1)
        panY: 0.5,  // relative to bounding box (0-1)
        rotation: 0
    };
    // Initialize the viewer if OpenSeadragon is available


    // --- Improved viewport sync for images of different sizes ---
    function calculateRelativePosition(absolutePos, imageWidth, imageHeight) {
        // Convert absolute viewport position to relative position within bounding box

        var relativePosX = absolutePos.x;
        var relativePosY = absolutePos.y;
        if (!boundingBox) return absolutePos;
        if (imageWidth >= boundingBox.width + boundingBox.x) {
            relativePosX = Math.round(absolutePos.x - boundingBox.x);
        }
        if (imageHeight >= boundingBox.height + boundingBox.y) {
            relativePosY = Math.round(absolutePos.y - boundingBox.y);
        }

        return {
            x: relativePosX,
            y: relativePosY
        };
    }

    function calculateAbsolutePosition(relativePos, imageWidth, imageHeight) {
        var absolutePosX = relativePos.x;
        var absolutePosY = relativePos.y;
        if (!boundingBox) return absolutePos;
        if (imageWidth >= boundingBox.width + boundingBox.x) {
            absolutePosX = Math.round(boundingBox.x + relativePos.x);
        }
        if (imageHeight >= boundingBox.height + boundingBox.y) {
            absolutePosY = Math.round(boundingBox.y + relativePos.y);
        }

        return {
            x: absolutePosX,
            y: absolutePosY
        };
    }

    function saveViewportState() {
        // Save current viewport state as relative position
        if (viewer && boundingBox) {
            var center = viewer.viewport.viewportToImageCoordinates(viewer.viewport.getCenter());
            var imageWidth = viewer.source.dimensions.x;
            var imageHeight = viewer.source.dimensions.y;
            var relativePos = calculateRelativePosition(center, imageWidth, imageHeight);
            // Save zoom as a ratio relative to the bounding box
            relativeViewportState.zoom = viewer.viewport.getZoom(true) * (boundingBox.width / imageWidth );
            relativeViewportState.panX = relativePos.x;
            relativeViewportState.panY = relativePos.y;
            relativeViewportState.rotation = viewer.viewport.getRotation();
        }
    }

    function restoreViewportState() {
        // Restore viewport state using relative position
        
        setTimeout(function() {
            var imageWidth = viewer.source.dimensions.x;
            var imageHeight = viewer.source.dimensions.y;
            var absolutePos = calculateAbsolutePosition({
                x: relativeViewportState.panX,
                y: relativeViewportState.panY
            }, imageWidth, imageHeight);
            var ptVp = viewer.viewport.imageToViewportCoordinates(new OpenSeadragon.Point(absolutePos.x, absolutePos.y));
            // Convert relative zoom back to image zoom for this image
            var zoom = relativeViewportState.zoom * (imageWidth / boundingBox.width);
            viewer.viewport.zoomTo(zoom, ptVp, true);
            viewer.viewport.panTo(ptVp, true);
            viewer.viewport.setRotation(relativeViewportState.rotation);
        }, 1); // Small delay to ensure image is loaded
        
    }

    function switchImages() {
        var next = false
        if (event.ctrlKey) {
            next = false;
        }
        else if (event.altKey) {
            next = true;
        }
        else 
            return;
        if (next)
        {
            cur_img = (cur_img + 1) %  Object.keys(imgs).length;
        }
        else
        {
            cur_img = (cur_img - 1 + Object.keys(imgs).length) % Object.keys(imgs).length;
        }
        
        if (typeof OpenSeadragon !== 'undefined') {
            // Save current viewport state before switching
            saveViewportState();

            // Remove previous image if any
            if (viewer && viewer.drawer && viewer.drawer.canvas) {
                // Clear the canvas to avoid ghost images
                viewer.drawer.canvas.getContext('2d').clearRect(0, 0, viewer.drawer.canvas.width, viewer.drawer.canvas.height);
            }

            // Switch tileSources
            viewer.open({
                type: 'image',
                url: imgs[Object.keys(imgs)[cur_img]],
                title: Object.keys(imgs)[cur_img],
                success: function() {
                    restoreViewportState();
                }
            });
            viewer.preserveViewport = true;
            // Restore viewport after image loads
            //viewer.addOnceHandler('open', restoreViewportState);
        } else {
            // Fallback to simple <img> tag if OpenSeadragon is not available
            var container = document.getElementById("openseadragon-viewer");
            container.innerHTML = ""; // Clear previous image
            var imgTag = document.createElement("img");
            imgTag.src = 'data:image/png;base64,'+imgs[Object.keys(imgs)[cur_img]]; // Provide image data here
            imgTag.style.maxWidth = '100%';
            imgTag.style.maxHeight = '100%';
            container.appendChild(imgTag);
        }
        updateImageName();
    }
    
 
    if (typeof OpenSeadragon !== 'undefined') {
        var viewer = OpenSeadragon({
            id: "openseadragon-viewer",
            title: Object.keys(imgs)[cur_img],
            prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/2.4.2/images/", // CDN path to OpenSeadragon images
            tileSources: {
                type: 'image',
                url: imgs[Object.keys(imgs)[cur_img]] // URL or path to the initial image
            },
            maxZoomPixelRatio: 10 // Set maximum zoom level to 10
        });
        viewer.preserveViewport = true;
        
        // Add viewport change handler to track position changes
        //viewer.addHandler('viewport-change', function(event) {
            // Update relative viewport state when user navigates
        //    saveViewportState();
        //});

        // Add click event handler to the viewer
        viewer.addHandler('canvas-click', switchImages);
    } else {
        // Fallback to simple <img> tag if OpenSeadragon is not available
        var imgTag = document.createElement("img");
        imgTag.src = 'data:image/png;base64,'+imgs[Object.keys(imgs)[cur_img]]; // Provide image data here
        imgTag.style.maxWidth = '100%';
        imgTag.style.maxHeight = '100%';
        document.getElementById("openseadragon-viewer").appendChild(imgTag);
    }
    updateImageName() ;    
</script>
<div style="max-width:900px;margin:0 auto;">
    <a class="save-link" target="" href='javascript:window.parent.postMessage({"action":"show_image","value":"/show_im?example_vid={{video_name}}&example_index={{example_index}}}}&comp_index={{comp_index}}&main_path={{main_path}}&ref_path={{ref_path}}&save_image"})'>💾 Save Image</a>
    {% if save_path %}
        <div class="save-path">Image was saved to:<br>{{save_path}}</div>
    {% endif %}
</div>
<div class="detection-details">
    <div class="detection-details-title">Detection Details:</div>

    <table style="width:100%;border-collapse:collapse;font-size:0.98em;">
        <tbody>
            {% for line in detection_text_list %}
                <tr style="background-color:{{ loop.cycle('#ffffff', '#f5f8fb') }};border-bottom:1px solid #e1e6ed;">
                    <td style="padding:6px 8px;">{{ line }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
